name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  socket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies through Socket Firewall
        run: sfw npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Run Socket CLI CI scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "${SOCKET_SECURITY_API_KEY:-}" ]; then
            npx --yes @socketsecurity/cli@1.15.0 ci
          else
            echo "SOCKET_SECURITY_API_KEY is not set. Socket Firewall and npm audit checks ran."
          fi

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Enable Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install dependencies
        run: sfw npm ci

      - name: Verify
        run: npm run check

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Audit production dependencies
        run: npm run audit:prod

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enable Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: Install dependencies
        run: sfw npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Verify browser interaction
        run: npm run test:browser
